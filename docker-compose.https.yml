version: "3.9"

# HTTPS deployment WITH a domain + Let's Encrypt.
# Use this once you have a domain pointing to the VPS:
#   1. Edit nginx/nginx.conf -> replace your-domain.com
#   2. export REACT_APP_BACKEND_URL=https://your-domain.com
#   3. docker compose -f docker-compose.https.yml run --rm certbot certonly \
#        --webroot -w /var/www/certbot -d your-domain.com
#   4. docker compose -f docker-compose.https.yml up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - signage

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=halalmart_signage
    depends_on:
      - mongo
    networks:
      - signage

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - signage

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - signage

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:

networks:
  signage:
    driver: bridge
